[project]
name = "trialmatch-rag-workflow"
version = "0.1.0"
description = "MS2 retrieval and evidence-linked screening for synthetic T2D patients"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "google-genai>=1.39,<3",
  "chromadb>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]
# Host/CI tooling only; the API and Chroma images do not need DVC.
versioning = ["dvc[gs]>=3,<4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
