# Local Part 3 integration example for Part 4. Does not replace the team's root deployment.
services:
  rag-api:
    build:
      context: ../..
      dockerfile: services/rag_workflow/Dockerfile
    env_file: .env
    environment:
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../services:/app/services:ro
      - ../../artifacts/rag_workflow:/app/artifacts/rag_workflow
    depends_on:
      - rag-chromadb
  rag-chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - rag-chroma-data:/data
volumes:
  rag-chroma-data:
