# Explicit opt-in. Preparation stays offline; only screening uses Gemini.
services:
  rag-api:
    environment:
      TRIALMATCH_MODE: live
      GCP_PROJECT: ${GCP_PROJECT:?Set GCP_PROJECT in .env}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATIVE_MODEL: ${GENERATIVE_MODEL:-gemini-3.1-flash-lite}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-credentials.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Set the absolute credential file path in .env}
        target: /secrets/google-credentials.json
        read_only: true
        bind:
          create_host_path: false
