name: trialmatch-ovrz-ms2
services:
  prepare:
    build:
      context: ../..
      dockerfile: demo/ovrz/Dockerfile
    command: python -m services.frontend.prepare
    volumes:
      - rag-artifacts:/app/artifacts
    environment:
      TRIALMATCH_MODE: offline
      TRIALMATCH_ARTIFACTS: /app/artifacts/ovrz/rag_workflow
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
    depends_on:
      rag-chromadb:
        condition: service_started
    restart: "no"

  rag-api:
    build:
      context: ../..
      dockerfile: demo/ovrz/Dockerfile
    environment:
      TRIALMATCH_MODE: offline
      TRIALMATCH_ARTIFACTS: /app/artifacts/ovrz/rag_workflow
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rag-artifacts:/app/artifacts
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  rag-chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - rag-chroma-data:/data

volumes:
  rag-chroma-data:
  rag-artifacts:
