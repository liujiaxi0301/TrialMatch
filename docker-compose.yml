services:
  trial-processing:
    build:
      context: .
      dockerfile: docker/trial-processing/Dockerfile
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-credentials.json
    volumes:
      - ./prepare_data.py:/app/prepare_data.py:ro
      - ./services/trial_ingestion/scripts:/app/services/trial_ingestion/scripts:ro
      - ./services/trial_ingestion/data:/app/services/trial_ingestion/data
      - ./services/trial_ingestion/.dvc:/app/services/trial_ingestion/.dvc
      - ./services/rag_workflow/.dvc:/app/services/rag_workflow/.dvc
      - ./services/rag_workflow/index_snapshots:/app/services/rag_workflow/index_snapshots
      - ./services/rag_workflow/examples/demo_manifest.json:/app/services/rag_workflow/examples/demo_manifest.json:ro
      - ./services/patient_processing/data/processed:/app/services/patient_processing/data/processed:ro
      - ./artifacts:/app/artifacts
      - ./secrets:/secrets:ro

  rag-api:
    build:
      context: .
      dockerfile: docker/rag-api/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - services.frontend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/services/rag_workflow
      - --reload-dir
      - /app/services/frontend
    environment:
      TRIALMATCH_MODE: ${TRIALMATCH_MODE:-offline}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATIVE_MODEL: ${GENERATIVE_MODEL:-gemini-3.1-flash-lite}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-credentials.json
      TRIALMATCH_TRIALS: services/trial_ingestion/data/processed/trials.jsonl
      TRIALMATCH_CRITERIA: services/trial_ingestion/data/processed/criteria.jsonl
      TRIALMATCH_PATIENTS: services/patient_processing/data/processed/batch25_patients.jsonl
      TRIALMATCH_MANIFEST: services/rag_workflow/examples/demo_manifest.json
      TRIALMATCH_ARTIFACTS: artifacts/infra/rag_workflow
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
      TRIALMATCH_CORS_ORIGINS: ${TRIALMATCH_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./services/rag_workflow:/app/services/rag_workflow:ro
      - ./services/frontend:/app/services/frontend:ro
      - ./services/trial_ingestion/data/processed:/app/services/trial_ingestion/data/processed:ro
      - ./services/patient_processing/data/processed:/app/services/patient_processing/data/processed:ro
      - ./artifacts:/app/artifacts
      - ./secrets:/secrets:ro
    depends_on:
      trial-processing:
        condition: service_completed_successfully
      rag-chromadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3));
          assert data['mode'] == os.environ['TRIALMATCH_MODE']
      interval: 5s
      timeout: 10s
      retries: 18

  rag-chromadb:
    build:
      context: .
      dockerfile: docker/chromadb/Dockerfile
    volumes:
      - rag-chroma-data:/data

volumes:
  rag-chroma-data:
