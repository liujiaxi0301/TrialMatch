services:
  workspace:
    build: .
    profiles: [dev]
    volumes:
      - .:/app
    environment:
      TRIALMATCH_MODE: offline

  trial-processing:
    build: .
    command: uv run --frozen python prepare_data.py
    volumes:
      - .:/app:ro
      - ./artifacts:/app/artifacts

  prepare:
    build: .
    command: uv run --frozen python -m services.frontend.prepare
    environment:
      TRIALMATCH_MODE: offline
      TRIALMATCH_TRIALS: services/trial_ingestion/data/processed/trials.jsonl
      TRIALMATCH_CRITERIA: services/trial_ingestion/data/processed/criteria.jsonl
      TRIALMATCH_PATIENTS: services/patient_processing/data/processed/batch25_patients.jsonl
      TRIALMATCH_MANIFEST: services/rag_workflow/examples/demo_manifest.json
      TRIALMATCH_ARTIFACTS: artifacts/infra/rag_workflow
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
    volumes:
      - .:/app:ro
      - ./artifacts:/app/artifacts
    depends_on:
      trial-processing:
        condition: service_completed_successfully
      rag-chromadb:
        condition: service_started

  rag-api:
    build: .
    command: uv run --frozen python -m uvicorn services.frontend.app:app --host 0.0.0.0 --port 8080
    environment:
      TRIALMATCH_MODE: offline
      TRIALMATCH_TRIALS: services/trial_ingestion/data/processed/trials.jsonl
      TRIALMATCH_CRITERIA: services/trial_ingestion/data/processed/criteria.jsonl
      TRIALMATCH_PATIENTS: services/patient_processing/data/processed/batch25_patients.jsonl
      TRIALMATCH_MANIFEST: services/rag_workflow/examples/demo_manifest.json
      TRIALMATCH_ARTIFACTS: artifacts/infra/rag_workflow
      CHROMADB_HOST: rag-chromadb
      CHROMADB_PORT: "8000"
      TRIALMATCH_CORS_ORIGINS: ${TRIALMATCH_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app:ro
      - ./artifacts:/app/artifacts
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 18

  rag-chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - rag-chroma-data:/data

volumes:
  rag-chroma-data:
