server {
    listen 8080;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /healthz { return 200 "ok\n"; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /en.html { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location /assets/ { alias /usr/share/nginx/html/; }

    # The browser talks to one origin; Docker resolves the API service name.
    location / {
        set $api http://rag-api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
