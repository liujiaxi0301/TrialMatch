[project]
name = "trialmatch-rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "pydantic==2.14.1",
    "google-genai==2.31.0",
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "google-cloud-storage>=3,<4",
    "torch==2.15.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
