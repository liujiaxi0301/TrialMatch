[project]
name = "trialmatch-dev"
version = "0.1.0"
description = "Environment for TrialMatch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.34.2",
    "pydantic==2.14.1",
    "google-genai==2.31.0",
    "chromadb==1.5.9",
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "dvc[gs]==3.67.1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
