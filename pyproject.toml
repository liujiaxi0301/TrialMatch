[project]
name = "trialmatch-dev"
version = "0.1.0"
description = "Shared Python development environment for TrialMatch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.34.2",
    "pydantic==2.14.1",
    "google-genai==2.31.0",
    "chromadb==1.5.9",
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]
# Optional host tools for the existing DVC snapshot workflow.
versioning = ["dvc[gs]>=3,<4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
